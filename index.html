<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tengue clicker RECODE</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
      body{
        background: linear-gradient(#2e2e2e, #141414);
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #cecece;
        margin: 0;
        padding: 10px;
        box-sizing: border-box;
      }
      .textoSmall {
        font-size: 15px;
        font-family: DM Sans;
        font-weight: 800;
        animation: splashText 0.5s ease-in-out infinite alternate;
        display: inline-block;
        will-change: transform;
        backface-visibility: hidden;
        -webkit-font-smoothing: antialiased;
      }

      @keyframes splashText {
      0% {
        transform: scale(1);
        }
      100% {
        transform: scale(1.15);
      }
        }

      h1{
        font-family: DM Sans;
        font-weight: 1000;
        font-size: 38px;
        text-align: center;
        margin-bottom: 10px;
      }

      .juegoPrincipal, .displays, .utilityContainer {
        font-family: Poppins;
        text-align: left;
        margin: 0;
        padding: 20px;
        border: #b1b0b0 solid 2px;
        border-radius: 8px;
        color: #b9b8b8;
        font-weight: 600;
        box-shadow: #b1b0b041 10px 8px;
        box-sizing: border-box;
      }

    /* Contenedor principal que pone la izquierda y la derecha lado a lado */
.main-layout {
    display: flex;
    flex-wrap: wrap; 
    gap: 20px; 
    margin-bottom: 20px;
    justify-content: center;
}

/* Sección izquierda (ahora agrupa el botón principal y los botones de utilidad abajo) */
.juegoPrincipal {
    flex: 1 1 320px; 
    background-color: #222;
    border: 2px solid #555;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Reducir espacio del puntaje */
.juegoPrincipal .puntaje {
    margin-top: 10px;
    margin-bottom: 15px;
    line-height: 1.2;
}

/* Sección derecha */
.displays {
    flex: 1 1 280px; 
    background-color: #222;
    border: 2px solid #555;
    border-radius: 8px;
    padding: 20px;
}

/* Contenedor inferior (ubicado ahora dentro de la sección izquierda) */
.utilityContainer {
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    background-color: #2a2a2a;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 15px;
    box-sizing: border-box;
    margin-top: auto; 
}

.btn{
  background: #444343;
  padding: 12px 20px;
  color: #cecece;
  border: rgb(165, 165, 165) solid 2px;
  border-radius: 9px;
  font-family: DM Sans;
  cursor: pointer;
  transition: transform 0.3s ease, background-color 0.3s ease;
  width: 100%;
  box-sizing: border-box;
  text-align: center;
}

.btn:hover {
  transform: scale(1.02);
}
.btn:active {
  background-color: rgb(136, 136, 136);
}
#rebirthBtn {
  background: linear-gradient(135deg, #3e4444, #6d7271);
  transition: all 0.4s ease;
}

.display{
  font-size: clamp(35px, 8vw, 50px); 
  word-break: break-all;
}

.btnPrincipal{
  background: linear-gradient(135deg, #474545, #2D231E);
  padding: 25px 40px;
  color: #cecece;
  border: rgb(165, 165, 165) solid 2px;
  border-radius: 9px;
  font-family: DM Sans;
  cursor: pointer;
  font-size: 32px;
  width: 100%;
  box-sizing: border-box;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: 0 4px 0 #1a1411;
  margin-bottom: 50px;
}

.btnPrincipal:hover {
  transform: scale(1.02);
}

.btnPrincipal:active {
  transform: scale(0.97) ;
}
    </style>
  </head>
  <body>
    <header class="title">
      <h1 class="textTitle">
        tengue clicker
        <p class="textoSmall">recode</p>
      </h1>
    </header>
    <dialog id="rebirthMenu">
      <h2 class="subtitle"> Tienda </h2>
      <button id="shopBtn1">Comprar Noli --- +500 tps (tengues/segundo) ---- 2 Ascenciones</button>
      <button>placeholder</button>
      <button>placeholder</button>
      <button>placeholder</button>
      <button id="closeMenuBtn">Cerrar Tienda</button>
      <p>Ascenciones <span id="rebirthDisplayModal">0</span></p>
    </dialog>
<div class="main-layout">
    <div class="juegoPrincipal">
      <button class="btnPrincipal" id="btn">tengue</button>
      <p class="puntaje">Puntaje: <br /><span class="display" id="puntajeDisplay">0</span></p>
      
      <!-- Contenedor de utilidad acomodado justo abajo del botón principal -->
      <div class="utilityContainer">
        <button class="btn" id="prestigeBtn">Convertir tenguenarios</button>
        <button class="btn" id="rebirthBtn">
          Ascender --- <span id="prestigeRebirth">15</span> tenguenarios
        </button>
      </div>
    </div>

    <div class="displays">
      <p class="multDisp">
        Tu tienes <br /><span class="display" id="multiplierDisplay">1</span><br />
        tengues/click
      </p>
      <p>
        Tu tienes <br /><span class="display" id="prestigeDisplay">0</span><br />
        tenguenario/s
      </p>
      <p>
        Tu has revivido <br /><span class="display" id="rebirthDisplay">0</span><br />
        veces
      </p>
    </div>
</div>

    <script>
      let puntajeMultiplier = 1;
      let puntajeReal = 0;
      let prestige = 0;
      let rebirthCounter = 0;

      let puntajeDisplay = document.getElementById("puntajeDisplay");
      let puntajeMultiplierDisp = document.getElementById("multiplierDisplay");
      let prestigeDisplay = document.getElementById("prestigeDisplay");
      let btn = document.getElementById("btn");
      let prestigeForRebirthDisplay = document.getElementById("prestigeRebirth");
      let rebirthCounterDisplay = document.getElementById("rebirthDisplay");
      let closeMenuBtn = document.getElementById("closeMenuBtn");
      let rebirthMenu = document.getElementById("rebirthMenu");
      let rebirthDisplayModal = document.getElementById("rebirthDisplayModal")
      
      // Matemáticas balanceadas desde cero
      let prestigeForRebirth = 15;
      let restaTenguePorTenguenario = 15;
      let LIMITE_PRESTIGIO = 50;

      const prestigeBtn = document.getElementById("prestigeBtn");
      const rebirthBtn = document.getElementById("rebirthBtn");

      displayMultiplier();
      displayPrestige();
      displayPrestigeRebirth();

      function displayMultiplier() {
        puntajeMultiplierDisp.innerHTML = Math.floor(puntajeMultiplier);
      }

      function displayTengues() {
        puntajeDisplay.innerHTML = Math.floor(puntajeReal);
      }

      function displayPrestige() {
        prestigeDisplay.innerHTML = Math.floor(prestige);
      }

      function displayPrestigeRebirth() {
        prestigeForRebirthDisplay.innerHTML = prestigeForRebirth;
      }

      function displayRebirthCounter(){
        rebirthCounterDisplay.innerHTML = rebirthCounter
      }

      function displayRebirthCounterModal(){
        rebirthDisplayModal.innerHTML = rebirthCounter
      }

      // 1. CLIC PRINCIPAL: Progresión controlada y sin saturación
      btn.addEventListener("click", function () {
        puntajeReal += puntajeMultiplier;

        while (puntajeReal >= LIMITE_PRESTIGIO) {
          prestige += 1;
          puntajeReal -= restaTenguePorTenguenario;
          LIMITE_PRESTIGIO += 35;
        }

        displayMultiplier();
        displayPrestige();
        displayTengues();
        displayRebirthCounter();
      });

      // 2. CONVERTIR TENGUENARIOS: Recompensa justa para mejorar el multiplicador
      prestigeBtn.addEventListener("click", function () {
        if (prestige > 0) {
          puntajeMultiplier += prestige; // Cada tenguenario suma +1 al multiplicador base
          prestige = 0;
          displayMultiplier();
          displayPrestige();
          displayTengues();
          displayRebirthCounter();
        } else {
          alert("¡No tienes tenguenarios para convertir!");
        }
      });

      // 3. ASCENDER (REBIRTH): Multiplicador masivo de poder con costo progresivo
      rebirthBtn.addEventListener("click", function () {
        if (prestige >= prestigeForRebirth) {
          puntajeMultiplier *= 2;
          prestige -= prestigeForRebirth; 
          prestigeForRebirth *= 2; 
          restaTenguePorTenguenario += 5; 
          rebirthCounter += 1;
          rebirthMenu.showModal();
        } else {
          let faltantes = prestigeForRebirth - prestige;
          alert(`Te faltan ${faltantes} tenguenarios para poder ascender.`);
        }
        displayMultiplier();
        displayPrestige();
        displayTengues();
        displayPrestigeRebirth();
        displayRebirthCounter();
        displayRebirthCounterModal();
      });

      //rebirthmenu
      closeMenuBtn.addEventListener("click", function(){
        rebirthMenu.close();
        displayMultiplier();
        displayPrestige();
        displayPrestigeRebirth();
        displayRebirthCounter();
      });
    </script>
  </body>
</html>
